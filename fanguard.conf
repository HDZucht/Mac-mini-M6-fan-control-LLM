# Deciding sensors: comma-separated prefixes of SMC keys. The hottest of them drives the fan.
#   TVD = voltage regulators next to the SoC (heat up first under LLM load)
#   Tg  = GPU · Tp = performance cores · Te = efficiency cores · TN = SSD
# Run `fanguard sensors` to see what your chip offers. If none of the prefixes exist, all T* sensors are used.
sensors=TVD,Tg,Tp
# Below `start` Apple's automatic control stays in charge; from `start` to `full` the speed rises linearly
# from minimum to maximum; above `full` the fan runs at maximum.
start=60
full=85
# Hand back to Apple only below start - hysteresis.
hysteresis=5
# Seconds between two readings.
interval=2
